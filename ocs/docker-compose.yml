version: '3.8'

services:
  # GLPI
  glpi:
    image: diouxx/glpi
    container_name: glpi
    ports:
      - "8081:80"
    volumes:
      - ./glpi:/var/www/html
      - ./glpi/files:/var/www/html/files
      - ./glpi/config:/var/www/html/config
    depends_on:
      - glpi_db
    networks:
      - glpi-net
    restart: unless-stopped

  glpi_db:
    image: mariadb:10.6
    container_name: glpi_db
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: glpidb
      MYSQL_USER: glpi
      MYSQL_PASSWORD: glpipassword
    volumes:
      - glpi_db_data:/var/lib/mysql
    networks:
      - glpi-net
    restart: unless-stopped

volumes:
  glpi_db_data:

networks:
  glpi-net:
    driver: bridge
